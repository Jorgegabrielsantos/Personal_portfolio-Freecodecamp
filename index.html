<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Personal Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header>
    <nav id="navbar">
      <div class="navbar-link"><a href="#welcome-section">About</a></div>
      <div class="navbar-link"><a href="#project-section">Work</a></div>
      <div class="navbar-link"><a href="#contact-section">Contact</a></div>
    </nav>
  </header>

  <main>

    <section id="welcome-section">
      <h1 id="name">Hey, I am Jorge</h1>
      <h2 id="job">a web developer</h2>
    </section>

    <section id="project-section">
      <h1 class="project-tile">These are some of my projects</h1>
      <hr>

      <div id="project-link">

        <a href="#" class="projects">
          <img src="https://cdn.freecodecamp.org/testable-projects-fcc/images/tribute.jpg" alt="Tribute Page">
          <p class="project-name">Tribute Page</p>
        </a>

        <a href="#" class="projects">
          <img src="https://cdn.freecodecamp.org/testable-projects-fcc/images/random-quote-machine.png" alt="Quote Machine">
          <p class="project-name">Random Quote Machine</p>
        </a>

        <a href="#" class="projects">
          <img src="https://cdn.freecodecamp.org/testable-projects-fcc/images/calc.png" alt="Calculator">
          <p class="project-name">JavaScript Calculator</p>
        </a>

        <a href="#" class="projects">
          <img src="https://cdn.freecodecamp.org/testable-projects-fcc/images/wiki.png" alt="Wikipedia Viewer">
          <p class="project-name">Wikipedia Viewer</p>
        </a>

      </div>

      <button id="show-all-btn">Show All ></button>
    </section>

  </main>

  <footer>
    <section id="contact-section">
      <h1 id="lets-work">Let's work together...</h1>
      <p id="coffee">How do you take your coffee?</p>

      <div class="contacts">
        <a id="profile-link" href="https://github.com/" target="_blank">
          <img src="https://cdn-icons-png.flaticon.com/128/25/25657.png" class="icons">
          GitHub
        </a>
      </div>
    </section>
  </footer>

</body>
</html>
